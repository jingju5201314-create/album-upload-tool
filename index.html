<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册图片添加工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%234f6ef7'/%3E%3Ccircle cx='9' cy='9' r='2' fill='white'/%3E%3Cpath d='M5 19l5-7 3 4 2-2 4 5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --text: #2d3142;
    --muted: #8a8fa3;
    --border: #e2e4ee;
    --success: #22a06b;
    --danger: #d64545;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px 16px;
    line-height: 1.6;
  }
  .container { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(45, 49, 66, 0.06);
    border: 1px solid var(--border);
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fafbfd;
    transition: border-color .2s;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
  textarea { resize: vertical; min-height: 100px; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .remember-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .remember-row input { width: auto; }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    min-height: 44px;
  }
  .btn-primary { background: var(--primary); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #a8b3e8; cursor: not-allowed; }
  #status { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 14px; word-break: break-all; }
  #status.ok { display: block; background: #e8f7f0; color: var(--success); border: 1px solid #b8e6d2; }
  #status.err { display: block; background: #fdeaea; color: var(--danger); border: 1px solid #f3c2c2; }
  #status.info { display: block; background: #eef1ff; color: var(--primary-dark); border: 1px solid #cdd6f7; }
  #preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
  .pitem { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 1; }
  .pitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pitem .pdel {
    position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
    background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%;
    cursor: pointer; font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .pitem .pdel:hover { background: var(--danger); }
  .pitem.marked { opacity: .45; border: 2px solid var(--danger); }
  .pitem.marked::after {
    content: "已标记删除"; position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--danger); color: #fff; font-size: 11px; text-align: center; padding: 2px 0;
    z-index: 2;
  }
  .manage-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .manage-bar .btn { min-height: 40px; }
  #manageCount { font-size: 13px; color: var(--muted); }
  .btn-ghost { background: #eef0f7; color: var(--text); }
  .btn-ghost:hover { background: #e2e5f0; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b53a3a; }
  .btn-danger:disabled { background: #e8a3a3; cursor: not-allowed; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; padding: 4px 0; }
  details .adv-body { margin-top: 6px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    background: #fafbfd;
    transition: all .15s;
    color: var(--text);
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  code { background: #f0f1f6; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  @media (max-width: 640px) {
    input, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>相册图片添加工具</h1>
  <div class="subtitle">粘贴图片链接 → 写入博客相册。提交后到博客页面 3 秒内连点左上角 logo 3 次刷新缓存即可显示</div>

  <div class="card">
    <label for="token">GitHub Token</label>
    <input type="password" id="token" placeholder="ghp_..." autocomplete="off">
    <div class="remember-row">
      <input type="checkbox" id="rememberToken" checked>
      <label for="rememberToken" style="margin:0;font-weight:400">记住 token（仅保存在这台电脑的浏览器里）</label>
    </div>
  </div>

  <div class="card">
    <label for="albumId">相册</label>
    <input type="text" id="albumId" placeholder="选择已有相册，或输入新相册名（英文）" list="albumList">
    <datalist id="albumList"></datalist>
    <div class="chip-row" id="albumChips"></div>
    <div class="hint">输入已有相册名会追加图片；新名字会自动创建相册。也可以点上面的标签快速选择</div>
  </div>

  <div class="card">
    <label>管理相册图片（删除）</label>
    <div class="manage-bar">
      <button class="btn btn-ghost" id="loadManageBtn" type="button">加载相册图片</button>
      <span id="manageCount"></span>
    </div>
    <div id="manageGrid"></div>
    <div class="manage-bar">
      <button class="btn btn-danger" id="deleteMarkedBtn" type="button" disabled>删除已标记的图片</button>
    </div>
    <div id="manageStatus" style="margin-top:10px"></div>
    <div class="hint">点图片右上角的 ✕ 标记要删除的图（可多选），再点"删除已标记的图片"保存。删除前会弹窗确认</div>
  </div>

  <div class="card">
    <label for="links">图片链接（每行一个，可批量粘贴）</label>
    <textarea id="links" placeholder="https://example.com/1.webp&#10;https://example.com/2.webp"></textarea>
    <div id="preview"></div>
  </div>

  <div class="card">
    <details>
      <summary>高级选项（新建相册时可用：标题 / 封面 / 描述 / 标签）</summary>
      <div class="adv-body">
        <label for="albumTitle">相册标题</label>
        <input type="text" id="albumTitle" placeholder="留空则用相册名">
        <label for="albumCover">封面图 URL</label>
        <input type="text" id="albumCover" placeholder="留空则用第一张图">
        <label for="albumDesc">相册描述</label>
        <input type="text" id="albumDesc" placeholder="可选">
        <label for="albumTags">标签（逗号分隔）</label>
        <input type="text" id="albumTags" placeholder="旅行, 风景">
      </div>
    </details>
  </div>

  <div class="card">
    <button class="btn btn-primary" id="submitBtn">写入相册</button>
    <div id="status"></div>
  </div>
</div>

<script>
const API = 'https://api.github.com';
const OWNER_REPO = 'jingju5201314-create/imgbed-blog-config';
const BRANCH = 'main';
const LS_TOKEN = 'album_tool_token';
const LS_ALBUM = 'album_tool_last_album';
const $ = id => document.getElementById(id);

// ---- 初始化：恢复记住的 token / 相册，加载已有相册列表 ----
(function init() {
  const savedToken = localStorage.getItem(LS_TOKEN);
  if (savedToken) { $('token').value = savedToken; $('rememberToken').checked = true; }
  const savedAlbum = localStorage.getItem(LS_ALBUM);
  if (savedAlbum) $('albumId').value = savedAlbum;
  $('links').addEventListener('input', refreshPreview);
  loadAlbums();
})();

async function loadAlbums() {
  const token = $('token').value.trim();
  if (!token) return;
  try {
    const albums = await gh(`/repos/${OWNER_REPO}/contents/albums?ref=${BRANCH}`);
    const ids = albums.filter(i => i.type === 'dir').map(i => i.name);
    // 更新 datalist
    $('albumList').innerHTML = ids.map(id => `<option value="${esc(id)}"></option>`).join('');
    // 更新标签 chips（最多显示 8 个）
    const chipBox = $('albumChips');
    chipBox.innerHTML = '';
    ids.slice(0, 8).forEach(id => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip';
      c.textContent = id;
      c.onclick = () => { $('albumId').value = id; markActive(id); };
      chipBox.appendChild(c);
    });
  } catch (e) { /* token 未填或网络问题，静默 */ }
}

function markActive(id) {
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === id));
}

function refreshPreview() {
  const urls = getUrls();
  $('preview').innerHTML = '';
  urls.slice(0, 24).forEach(u => {
    const item = document.createElement('div');
    item.className = 'pitem';
    const img = document.createElement('img');
    img.src = u;
    img.alt = '';
    img.onerror = () => { img.style.opacity = '.25'; };
    item.appendChild(img);
    $('preview').appendChild(item);
  });
}

function getUrls() {
  return $('links').value.split('\n').map(s => s.trim()).filter(Boolean);
}

// ---- GitHub API ----
function setStatus(msg, type) {
  const el = $('status');
  el.className = type;
  el.innerHTML = msg;
}
async function gh(path, method = 'GET', body = null) {
  const token = $('token').value.trim();
  if (!token) throw new Error('请先填写 GitHub Token');
  const headers = { Authorization: 'token ' + token, 'User-Agent': 'album-tool', Accept: 'application/vnd.github+json' };
  const opts = { method, headers };
  if (body) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!res.ok) {
    const msg = data && data.message ? data.message : ('HTTP ' + res.status);
    throw new Error(msg);
  }
  return data;
}
async function getAlbumInfo(albumId) {
  try {
    const data = await gh(`/repos/${OWNER_REPO}/contents/albums/${albumId}/info.json?ref=${BRANCH}`);
    return { data, json: JSON.parse(atob(data.content)) };
  } catch (e) {
    return null;
  }
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- 管理相册图片（删除）----
let manageAlbum = null;      // 当前管理的相册 JSON
let manageSha = null;        // 当前相册文件 sha
let manageMarked = new Set(); // 标记删除的图片 id

async function loadManage() {
  const token = $('token').value.trim();
  const albumId = $('albumId').value.trim();
  const box = $('manageGrid');
  box.innerHTML = '';
  $('manageCount').textContent = '';
  $('deleteMarkedBtn').disabled = true;
  $('manageStatus').innerHTML = '';
  manageMarked = new Set();
  if (!token) { $('manageStatus').innerHTML = '<div class="hint" style="color:var(--danger)">请先填写 GitHub Token</div>'; return; }
  if (!albumId) { $('manageStatus').innerHTML = '<div class="hint" style="color:var(--danger)">请先在上方填写相册名</div>'; return; }

  $('loadManageBtn').disabled = true;
  try {
    const found = await getAlbumInfo(albumId);
    if (!found) {
      $('manageStatus').innerHTML = '<div class="hint">相册 <b>' + esc(albumId) + '</b> 不存在，无法管理</div>';
      return;
    }
    manageAlbum = found.json;
    manageSha = found.data.sha;
    const photos = manageAlbum.photos || [];
    $('manageCount').textContent = '共 ' + photos.length + ' 张图片';
    if (photos.length === 0) {
      box.innerHTML = '<div class="hint">该相册暂无图片</div>';
      return;
    }
    photos.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'pitem';
      item.dataset.pid = p.id;
      const img = document.createElement('img');
      img.src = p.src;
      img.alt = p.title || '';
      img.loading = 'lazy';
      img.onerror = () => { img.style.opacity = '.25'; };
      const del = document.createElement('button');
      del.className = 'pdel';
      del.textContent = '✕';
      del.title = '标记删除';
      del.onclick = () => {
        const pid = item.dataset.pid;
        if (manageMarked.has(pid)) {
          manageMarked.delete(pid);
          item.classList.remove('marked');
        } else {
          manageMarked.add(pid);
          item.classList.add('marked');
        }
        $('deleteMarkedBtn').disabled = manageMarked.size === 0;
      };
      item.appendChild(img);
      item.appendChild(del);
      box.appendChild(item);
    });
  } catch (e) {
    $('manageStatus').innerHTML = '<div class="hint" style="color:var(--danger)">加载失败：' + esc(e.message) + '</div>';
  } finally {
    $('loadManageBtn').disabled = false;
  }
}

async function deleteMarked() {
  if (!manageAlbum || manageMarked.size === 0) return;
  const albumId = $('albumId').value.trim();
  const markedIds = [...manageMarked];
  const total = (manageAlbum.photos || []).length;
  if (!confirm('确定从相册「' + albumId + '」删除 ' + markedIds.length + ' 张图片吗？\n此操作会提交到 GitHub 仓库，删除后需刷新缓存生效。')) return;

  $('deleteMarkedBtn').disabled = true;
  $('manageStatus').innerHTML = '<div class="hint">正在删除…</div>';
  try {
    manageAlbum.photos = (manageAlbum.photos || []).filter(p => !markedIds.includes(p.id));
    // 如果删掉了封面，封面换成第一张图
    if (manageAlbum.cover && manageAlbum.photos.length > 0) {
      const coverSrc = manageAlbum.photos[0].src;
      const oldCover = manageAlbum.cover;
      if (!manageAlbum.photos.some(p => p.src === oldCover)) {
        manageAlbum.cover = coverSrc;
      }
    }
    if (manageAlbum.photos.length === 0) manageAlbum.cover = '';

    const raw = JSON.stringify(manageAlbum, null, '\t');
    const newContent = raw.split('\n').map(l => l.replace(/\s+$/, '')).join('\n') + '\n';
    const putBody = {
      message: 'album: delete ' + markedIds.length + ' photo(s) from ' + albumId,
      content: btoa(unescape(encodeURIComponent(newContent))),
      branch: BRANCH
    };
    if (manageSha) putBody.sha = manageSha;
    const result = await gh(`/repos/${OWNER_REPO}/contents/albums/${albumId}/info.json`, 'PUT', putBody);
    $('manageStatus').innerHTML = '<div class="hint" style="color:var(--success)">已删除 ' + markedIds.length + ' 张（剩余 ' + manageAlbum.photos.length + ' 张）。回到博客三连击 logo 刷新缓存生效</div>';
    await loadManage(); // 重新加载
    loadAlbums();
  } catch (e) {
    $('manageStatus').innerHTML = '<div class="hint" style="color:var(--danger)">删除失败：' + esc(e.message) + '</div>';
    $('deleteMarkedBtn').disabled = false;
  }
}

$('loadManageBtn').addEventListener('click', loadManage);
$('deleteMarkedBtn').addEventListener('click', deleteMarked);

// ---- 提交 ----
$('submitBtn').addEventListener('click', async () => {
  const token = $('token').value.trim();
  const albumId = $('albumId').value.trim();
  const urls = getUrls();
  if (!token) { setStatus('请先填写 GitHub Token', 'err'); return; }
  if (!albumId) { setStatus('请填写相册名', 'err'); return; }
  if (urls.length === 0) { setStatus('请至少粘贴一个图片链接', 'err'); return; }
  if (!/^[a-zA-Z0-9-_]+$/.test(albumId)) { setStatus('相册名只能包含字母、数字、短横线、下划线', 'err'); return; }

  // 记住 token 和相册
  if ($('rememberToken').checked) localStorage.setItem(LS_TOKEN, token);
  else localStorage.removeItem(LS_TOKEN);
  localStorage.setItem(LS_ALBUM, albumId);

  $('submitBtn').disabled = true;
  setStatus('正在写入…', 'info');
  try {
    const found = await getAlbumInfo(albumId);
    let album, existingSha = null;
    if (found) {
      album = found.json;
      existingSha = found.data.sha;
    } else {
      const today = new Date().toISOString().slice(0, 10);
      album = {
        id: albumId,
        title: $('albumTitle').value.trim() || albumId,
        description: $('albumDesc').value.trim() || '',
        cover: $('albumCover').value.trim() || '',
        date: today,
        location: '',
        tags: $('albumTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
        password: '',
        photos: []
      };
    }
    const coverVal = $('albumCover').value.trim();
    if (coverVal) album.cover = coverVal;
    if (!album.cover && urls.length > 0) album.cover = urls[0];

    const existingPhotos = album.photos || [];
    const idSet = new Set(existingPhotos.map(p => p.id));
    let n = 0;
    urls.forEach(u => {
      let pid = albumId + '-photo-' + (existingPhotos.length + n + 1);
      while (idSet.has(pid)) { n++; pid = albumId + '-photo-' + (existingPhotos.length + n + 1); }
      idSet.add(pid);
      existingPhotos.push({ id: pid, src: u, alt: String(existingPhotos.length + n + 1), title: String(existingPhotos.length + n + 1), tags: [] });
      n++;
    });
    album.photos = existingPhotos;

    const raw = JSON.stringify(album, null, '\t');
    const newContent = raw.split('\n').map(l => l.replace(/\s+$/, '')).join('\n') + '\n';
    const putBody = {
      message: 'album: add ' + urls.length + ' photo(s) to ' + albumId,
      content: btoa(unescape(encodeURIComponent(newContent))),
      branch: BRANCH
    };
    if (existingSha) putBody.sha = existingSha;
    const result = await gh(`/repos/${OWNER_REPO}/contents/albums/${albumId}/info.json`, 'PUT', putBody);
    setStatus(
      '✅ 成功！已向相册 <b>' + esc(albumId) + '</b> 添加 ' + urls.length + ' 张图片（共 ' + existingPhotos.length + ' 张）。<br>' +
      '提交：<code>' + result.content.sha.slice(0, 7) + '</code><br>' +
      '下一步：回到博客页面，3 秒内连续点击左上角 logo/站点标题 3 次刷新缓存。',
      'ok'
    );
    $('links').value = '';
    refreshPreview();
    loadAlbums();
  } catch (e) {
    setStatus('❌ 失败：' + esc(e.message), 'err');
  } finally {
    $('submitBtn').disabled = false;
  }
});
</script>
</body>
</html>
